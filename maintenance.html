<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Equipment Data Editor | Mech Arena Tactical Hub</title><style>body{font:16px system-ui;background:#101827;color:#eef5ff;max-width:980px;margin:32px auto;padding:16px}a{color:#8ad9ff}textarea{box-sizing:border-box;width:100%;min-height:390px;background:#19263a;color:white;padding:16px;font:13px monospace}button,select,input{padding:10px;margin:5px;background:#243d5b;color:white;border:1px solid #6a8aab;border-radius:6px}#message{white-space:pre-wrap}label{display:block;margin-top:15px}</style><h1>Equipment database editor</h1><p><strong>Local-only editor:</strong> This page does not write to GitHub. Load JSON, edit, validate, download, then upload the changed file to GitHub. Anyone can access this page if they know its URL, so never put secrets in it.</p><p><a href="/equipment-database.html">Equipment database</a> · <a href="/promo-codes.html">Promo codes</a></p><label>File <select id="kind"><option>mechs.json</option><option>weapons.json</option><option>promo-codes.json</option></select></label><button id="load">Load published data</button><label>Or import a local JSON file <input type="file" id="file" accept=".json,application/json"></label><textarea id="editor" spellcheck="false" aria-label="JSON editor"></textarea><p><button id="validate">Validate</button><button id="download">Download JSON</button></p><p id="message" role="status"></p><script>
const $=id=>document.getElementById(id);let name=()=> $('kind').value;
$('load').onclick=async()=>{try{const r=await fetch('/'+name(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);$('editor').value=JSON.stringify(await r.json(),null,2);$('message').textContent='Loaded '+name()}catch(e){$('message').textContent=e.message}};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const expected=name();if(f.name!==expected){$('message').textContent='Warning: imported '+f.name+' but selected '+expected} $('editor').value=await f.text()};
function check(){const d=JSON.parse($('editor').value);if(!d||typeof d!=='object'||Array.isArray(d))throw Error('Root must be an object');const n=name();const key=n==='mechs.json'?'mechs':n==='weapons.json'?'weapons':'codes';if(!Array.isArray(d[key]))throw Error('Expected array: '+key);const seen=new Set();for(const x of d[key]){if(!x||typeof x!=='object')throw Error('Invalid item');const id=key==='codes'?x.code:x.name;if(typeof id!=='string'||!id.trim())throw Error('Missing '+(key==='codes'?'code':'name'));if(seen.has(id.toUpperCase()))throw Error('Duplicate: '+id);seen.add(id.toUpperCase());if(key==='codes'&&!/^[A-Z0-9]{4,32}$/.test(id))throw Error('Invalid promo code: '+id)}return d}
$('validate').onclick=()=>{try{const d=check();$('message').textContent='Valid JSON: '+(d.mechs||d.weapons||d.codes).length+' entries'}catch(e){$('message').textContent='Error: '+e.message}};
$('download').onclick=()=>{try{const d=check(),blob=new Blob([JSON.stringify(d,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('message').textContent='Downloaded '+name()+'. Upload it to GitHub to publish changes.'}catch(e){$('message').textContent='Error: '+e.message}};
$('load').click();
</script></html>
